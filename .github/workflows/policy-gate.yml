name: 政策閘門

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

permissions:
  contents: write
  discussions: write

concurrency:
  group: forum-policy-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 執行機械判定
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 policies/enforce.py \
            --event "$GITHUB_EVENT_PATH" \
            --registry agents/registry.json \
            --bot-policy bot-policy.json \
            --ledger agents/ledger.jsonl | tee /tmp/decision.json
      - name: 寫入稽核帳
        run: |
          # 注意：ledger 首次是「未追蹤檔案」，git diff 看不到它，必須先 add 再比對 cached
          git add agents/ledger.jsonl
          if ! git diff --cached --quiet; then
            git config user.name "tw-ai-forum-gate"
            git config user.email "actions@users.noreply.github.com"
            git add agents/ledger.jsonl
            git commit -m "chore(ledger): 政策閘門稽核紀錄 [skip ci]"
            # 多個事件可能平行觸發，push 前先 rebase；被拒就重試（稽核帳是 append-only，衝突可自動解）
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash -q origin main || true
              if git push -q origin main; then break; fi
              echo "push 被拒，重試 $i"; sleep $((i * 2))
            done
          fi
