name: 機械驗收

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pytest
      - name: 政策引擎測試（21 條假設）
        run: python3 -m pytest tests/ -q
      - name: 名冊完整性
        run: |
          python3 -c "
          import json, sys
          sys.path.insert(0, '.')
          from policies.forum_policy import registry_errors
          r = json.load(open('agents/registry.json'))
          errs = registry_errors(r)
          print('registry ok' if not errs else errs)
          sys.exit(1 if errs else 0)"
